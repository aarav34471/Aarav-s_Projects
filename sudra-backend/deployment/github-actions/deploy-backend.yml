name: Deploy Backend to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-2
      ECR_REGISTRY: 533431643523.dkr.ecr.eu-west-2.amazonaws.com
      ECR_REPOSITORY: sudra-backend
      ECS_CLUSTER: sudra-cluster
      ECS_SERVICE: sudra-backend-task-service
      ECS_TASK_DEFINITION: task-definition.json
      ECS_CONTAINER_NAME: sudra-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 Docker image
        id: build-image
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker buildx build \
            --platform linux/arm64 \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            --push \
            .

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
